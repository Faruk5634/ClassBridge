spring.application.name=classbridge-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/classbridge_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

classbridge.attachments.storage-dir=${CLASSBRIDGE_ATTACHMENT_STORAGE_DIR:${user.home}/.classbridge/attachments}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
classbridge.mail.from=${MAIL_FROM:}
